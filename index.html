        * {

<body class="leading-tight">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-[100] flex items-center justify-center font-black text-blue-600 text-xl uppercase italic">CARREGANDO SISTEMA...</div>

    <!-- DETECTOR DE CHAVES -->
    <div id="detector" style="display:none;position:fixed;bottom:20px;right:20px;z-index:9999;background:#1e293b;color:white;padding:20px;border-radius:16px;font-family:monospace;font-size:12px;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,0.3)">
      <div style="font-weight:900;margin-bottom:10px;color:#60a5fa">CHAVES LOCALSTORAGE:</div>
      <div id="detector-keys"></div>
      <button onclick="exportarChave()" style="margin-top:12px;background:#16a34a;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:900;margin-right:8px">EXPORTAR</button>
      <button onclick="document.getElementById('detector').style.display='none'" style="margin-top:12px;background:#475569;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:900">FECHAR</button>
    </div>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const keys = Object.keys(localStorage);
          let html = '';
          let found = null;
          keys.forEach(k => {
            const v = localStorage.getItem(k);
            let count = '';
            try { const p = JSON.parse(v); if(Array.isArray(p) && p.length > 0) { count = ' → ' + p.length + ' registros'; if(!found) found = {k, p}; } } catch(e){}
            html += '<div style="margin:4px 0"><span style="color:#34d399">' + k + '</span><span style="color:#94a3b8">' + count + '</span></div>';
          });
          if(keys.length === 0) html = '<div style="color:#f87171">Nenhuma chave encontrada</div>';
          document.getElementById('detector-keys').innerHTML = html;
          document.getElementById('detector').style.display = 'block';
          window._dadosExportar = found;
        }, 2000);
      });
      function exportarChave() {
        // Tenta todas as variações de chave
        const tentativas = ['EXECUTEPRO_V24','executepro_v24','planos_v24','PLANOS_V24','planos','tasks'];
        let dados = null, chave = '';
        for(const k of tentativas) {
          const v = localStorage.getItem(k);
          if(v && v !== 'null') {
            try { const p = JSON.parse(v); if(Array.isArray(p) && p.length > 0) { dados = p; chave = k; break; } } catch(e){}
          }
        }
        if(!dados) { alert('Nenhum dado encontrado!'); return; }
        const blob = new Blob([JSON.stringify(dados, null, 2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup_executepro.json'; a.click();
        alert('✅ ' + dados.length + ' registros exportados!');
      }
    </script>

    <script>
        // CONFIGURAÇÃO FIREBASE (Atualizado conforme provisionamento)
        const firebaseConfig = {
            apiKey: "AIzaSyCFka2_7e9ktqZ3omV8lHBBuzd1Wd88emA",
            authDomain: "executepro-ff108.firebaseapp.com",
            projectId: "executepro-ff108",
            storageBucket: "executepro-ff108.appspot.com",
            messagingSenderId: "862620727559",
            appId: "1:862620727559:web:4515840f5eea40c64f6da2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let dadosGerais = [];
        let abaAtual = 'lista';
        let gestorAutenticado = false;

        function toggleForm() { document.getElementById('drawer-form').classList.toggle('translate-x-full'); }
        function fecharModal() { document.getElementById('modal-edit').classList.add('hidden'); }

        function mudarAba(aba) {
            abaAtual = aba;
            document.getElementById('aba-lista').classList.toggle('hidden', aba === 'dashboard');
            document.getElementById('aba-dashboard').classList.toggle('hidden', aba !== 'dashboard');
            document.getElementById('sidebar-kpi').classList.toggle('hidden', aba === 'dashboard');
            
            const tabs = ['ativos', 'concluidos', 'dash'];
            tabs.forEach(t => {
                const el = document.getElementById('tab-' + t);
                el.className = 'pb-1 transition ' + (t === (aba === 'lista' ? 'ativos' : (aba === 'concluidos' ? 'concluidos' : 'dash')) ? 'aba-ativa' : 'text-slate-400');
            });
            renderLista();
        }

        function verificarSenha() {
            if (gestorAutenticado) { gestorAutenticado = false; }
            else { if (prompt("SENHA GESTOR:") === "1570") gestorAutenticado = true; else alert("ERRO!"); }
            atualizarUI();
        }

        function atualizarUI() {
            const btn = document.getElementById('btn-lock');
            btn.innerText = gestorAutenticado ? "🔓 GESTOR" : "🔒 ACESSO";
            btn.className = gestorAutenticado ? "bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg" : "bg-slate-100 text-red-600 px-4 py-2 rounded-lg shadow-sm";
            renderLista(); 
        }

        async function deletarNoModal() {
            if (confirm("EXCLUIR DEFINITIVAMENTE?")) { await db.collection("planos").doc(document.getElementById('edit-id').value).delete(); fecharModal(); }
        }

        // Snapshots em Tempo Real
        db.collection("responsaveis").onSnapshot(snap => {
            const sp = document.getElementById('responsavel');
            const se = document.getElementById('edit-responsavel');
            const fl = document.getElementById('filtro-pessoa');
            const nomes = [];
            snap.forEach(doc => nomes.push(doc.data().nome));
            
            // Seed se vazio
            if(nomes.length === 0) {
                ['CARLOS ALBERTO', 'MARIA HELENA', 'ROBERTO SILVA'].forEach(n => db.collection("responsaveis").add({nome: n}));
                return;
            }

            sp.innerHTML = '<option value="" disabled selected>ESCOLHER RESPONSÁVEL...</option>';
            se.innerHTML = '<option value="" disabled selected>ESCOLHER...</option>';
            fl.innerHTML = '<option value="TODOS">TODOS OS NOMES</option>';
            
            nomes.sort().forEach(n => {
                const opt = `<option value="${n}">${n}</option>`;
                sp.innerHTML += opt;
                se.innerHTML += opt;
                fl.innerHTML += opt;
            });
        });

        db.collection("planos").orderBy('timestamp', 'desc').onSnapshot(snap => {
            document.getElementById('loading-overlay').classList.add('hidden');
            dadosGerais = [];
            snap.forEach(doc => dadosGerais.push({id: doc.id, ...doc.data()}));
            renderLista();
            updateKPIs();
        });

        function getDadosFiltrados() {
            const filtroPessoa = document.getElementById('filtro-pessoa').value;
            const filtroArea = document.getElementById('filtro-area').value;
            const filtroReq = document.getElementById('filtro-requisicao').value;
            let filtrados = [...dadosGerais];
            if (filtroPessoa !== "TODOS") filtrados = filtrados.filter(p => p.responsavel === filtroPessoa);
            if (filtroArea !== "TODOS") filtrados = filtrados.filter(p => p.area === filtroArea);
            if (filtroReq !== "TODOS") filtrados = filtrados.filter(p => p.status_requisicao === filtroReq);
            return filtrados;
        }

        function updateKPIs() {
            const d = getDadosFiltrados();
            const ativos = d.filter(p => p.status !== 'Concluído');
            const concluido = d.filter(p => p.status === 'Concluído');
            const andamento = d.filter(p => p.status === 'Em andamento');
            const atraso = ativos.filter(p => moment(p.data_conclusao).isBefore(moment(), 'day'));
            const total = d.length;
            const taxa = total > 0 ? Math.round((concluido.length / total) * 100) : 0;

            document.getElementById('kpi-pendente').innerText = ativos.length;
            document.getElementById('kpi-atraso').innerText = atraso.length;
            document.getElementById('kpi-concluido').innerText = concluido.length;
            document.getElementById('kpi-andamento').innerText = andamento.length;
            document.getElementById('kpi-taxa').innerText = taxa + '%';
        }

        function renderLista() {
            updateKPIs();
            if (abaAtual === 'dashboard') { renderDashboard(); return; }
            
            const lista = document.getElementById('aba-lista');
            lista.innerHTML = '';
            
            let filtrados = getDadosFiltrados().filter(p => (abaAtual === 'concluidos') ? p.status === 'Concluído' : p.status !== 'Concluído');
            
            filtrados.forEach(p => {
                const hoje = moment().startOf('day');
                const prazo = moment(p.data_conclusao).startOf('day');
                const diff = prazo.diff(hoje, 'days');
                
                let corBar = "border-blue-600";
                let statusLabel = p.area || 'GERAL';
                let bgCard = "bg-white";

                if (p.status === 'Concluído') {
                    corBar = "border-green-600";
                    bgCard = "bg-green-50/10";
                } else if (diff < 0) {
                    corBar = "border-red-600 critical-glow";
                    statusLabel = `URGENTE: ${p.area}`;
                    bgCard = "bg-red-50/5";
                } else if (p.status === 'Em andamento') {
                    corBar = "border-yellow-400";
                }

                lista.innerHTML += `
                    <div class="${bgCard} border-l-[20px] ${corBar} p-5 rounded-xl shadow-sm flex flex-col md:flex-row gap-4 items-center border border-slate-200">
                        <div class="flex-grow w-full">
                            <div class="flex justify-between items-start mb-2">
                                <span class="${diff < 0 && p.status !== 'Concluído' ? 'bg-red-100 text-red-700 italic' : 'bg-blue-100 text-blue-700'} text-[9px] px-2 py-0.5 rounded font-black uppercase">
                                    ${statusLabel}
                                </span>
                                <span class="text-slate-400 text-[9px] font-black uppercase">PRAZO: ${moment(p.data_conclusao).format('DD/MM/YYYY')}</span>
                            </div>
                            <h3 class="text-sm font-black text-slate-800 uppercase mb-3">${p.titulo}</h3>
                            <div class="flex items-center gap-2 mb-3">
                                <div class="h-2 w-2 rounded-full bg-slate-300"></div>
                                <span class="text-[9px] font-black text-slate-500">${p.responsavel}</span>
                            </div>
                            <textarea onblur="mudarObs('${p.id}', this.value)" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-lg text-[10px] font-black text-slate-600 outline-none focus:bg-white transition" placeholder="NOTAS E PENDÊNCIAS...">${p.observacao || ''}</textarea>
                        </div>
                        <div class="flex flex-col gap-3 shrink-0 w-full md:w-auto">
                            <select onchange="mudarStatus('${p.id}', this.value)" class="text-[10px] font-black p-3 border border-slate-200 rounded-lg uppercase bg-white">
                                <option value="Não iniciado" ${p.status==='Não iniciado'?'selected':''}>Não iniciado</option>
                                <option value="Em andamento" ${p.status==='Em andamento'?'selected':''}>Em andamento</option>
                                <option value="Concluído" ${p.status==='Concluído'?'selected':''}>Concluído</option>
                            </select>
                            <div class="flex justify-between items-center gap-4">
                                <span class="text-[9px] font-black text-slate-400 bg-slate-50 px-2 py-1 rounded">
                                    ${p.status_requisicao || 'S/ DOCUMENTO'}
                                </span>
                                ${gestorAutenticado ? `<button onclick="abrirEdicao('${p.id}')" class="text-blue-600 text-sm hover:scale-110 transition font-black">✏️</button>` : ''}
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function mudarStatus(id, s) { await db.collection("planos").doc(id).update({ status: s }); }
        async function mudarObs(id, t) { await db.collection("planos").doc(id).update({ observacao: t.toUpperCase() }); }
        
        function renderDashboard() {
            const d = getDadosFiltrados();
            const total = d.length;
            const concluido = d.filter(p => p.status === 'Concluído').length;
            const andamento = d.filter(p => p.status === 'Em andamento').length;
            const naoIniciado = d.filter(p => p.status === 'Não iniciado').length;
            const atraso = d.filter(p => p.status !== 'Concluído' && moment(p.data_conclusao).isBefore(moment(), 'day')).length;
            const taxa = total > 0 ? Math.round((concluido / total) * 100) : 0;
            const comReq = d.filter(p => p.status_requisicao && p.status_requisicao !== '').length;
            const semReq = total - comReq;

            const AREAS = ['EHS','SODEXO','INHAUS','OBRA CIVIL','SEGURANÇA','PROJETO','AVARIA SODEXO','AVARIA IN HAUS','AVARIA TRANSPORTADORA','REFORMA','PINTURA','OUTROS'];
            const COLORS = ['#2563eb','#16a34a','#f59e0b','#dc2626','#8b5cf6','#ec4899','#f97316','#06b6d4','#475569','#10b981','#a16207','#64748b'];
            const areaData = AREAS.map((a,i) => ({ name: a, total: d.filter(p=>p.area===a).length, conc: d.filter(p=>p.area===a&&p.status==='Concluído').length, color: COLORS[i] })).filter(x=>x.total>0);

            // Vencendo nos próximos 7 dias
            const vencendo = d.filter(p => p.status !== 'Concluído' && moment(p.data_conclusao).diff(moment(),'days') >= 0 && moment(p.data_conclusao).diff(moment(),'days') <= 7).length;

            const dash = document.getElementById('aba-dashboard');

            // Barra de progresso geral
            const progressBar = `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm font-black text-slate-700">PROGRESSO GERAL DO PORTFÓLIO</span>
                    <span class="text-2xl font-black text-blue-600">${taxa}%</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-6 overflow-hidden">
                    <div class="h-6 rounded-full bg-gradient-to-r from-blue-500 to-green-500 transition-all" style="width:${taxa}%"></div>
                </div>
                <div class="flex justify-between mt-3 text-xs font-black text-slate-400">
                    <span>${concluido} CONCLUÍDOS</span><span>${total} TOTAL</span>
                </div>
            </div>`;

            // KPI cards BI
            const kpiCards = `
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white rounded-2xl border-t-4 border-blue-600 p-5 shadow-sm">
                    <p class="text-xs font-black text-slate-400 mb-1">TOTAL GERAL</p>
                    <p class="text-4xl font-black text-slate-900">${total}</p>
                    <p class="text-xs text-slate-400 mt-1">AÇÕES CADASTRADAS</p>
                </div>
                <div class="bg-white rounded-2xl border-t-4 border-green-600 p-5 shadow-sm">
                    <p class="text-xs font-black text-slate-400 mb-1">CONCLUÍDOS</p>
                    <p class="text-4xl font-black text-green-600">${concluido}</p>
                    <p class="text-xs text-slate-400 mt-1">FINALIZADOS</p>
                </div>
                <div class="bg-white rounded-2xl border-t-4 border-red-500 p-5 shadow-sm">
                    <p class="text-xs font-black text-slate-400 mb-1">EM ATRASO</p>
                    <p class="text-4xl font-black text-red-600">${atraso}</p>
                    <p class="text-xs text-slate-400 mt-1">PRAZO VENCIDO</p>
                </div>
                <div class="bg-white rounded-2xl border-t-4 border-yellow-400 p-5 shadow-sm">
                    <p class="text-xs font-black text-slate-400 mb-1">VENCE EM 7 DIAS</p>
                    <p class="text-4xl font-black text-yellow-600">${vencendo}</p>
                    <p class="text-xs text-slate-400 mt-1">ATENÇÃO NECESSÁRIA</p>
                </div>
            </div>`;

            // Gráfico barras por status (SVG)
            const maxBar = Math.max(naoIniciado, andamento, concluido, atraso, 1);
            const barH = 160;
            const bars = [
                {label:'NÃO INICIADO', val:naoIniciado, color:'#2563eb'},
                {label:'EM ANDAMENTO', val:andamento, color:'#f59e0b'},
                {label:'CONCLUÍDO', val:concluido, color:'#16a34a'},
                {label:'EM ATRASO', val:atraso, color:'#dc2626'},
            ];
            const barW = 60; const gap = 30; const svgW = bars.length*(barW+gap)+gap;
            const barsSVG = bars.map((b,i) => {
                const h = Math.max((b.val/maxBar)*barH, 4);
                const x = gap + i*(barW+gap);
                const y = barH - h + 20;
                return `<g>
                    <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="8" fill="${b.color}" opacity="0.9"/>
                    <text x="${x+barW/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="900" fill="${b.color}">${b.val}</text>
                    <text x="${x+barW/2}" y="${barH+38}" text-anchor="middle" font-size="8" font-weight="900" fill="#64748b">${b.label}</text>
                </g>`;
            }).join('');

            const barChart = `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <p class="text-sm font-black text-slate-700 mb-4">DISTRIBUIÇÃO POR STATUS</p>
                <svg viewBox="0 0 ${svgW} ${barH+50}" width="100%" style="text-transform:uppercase">
                    <line x1="0" y1="${barH+20}" x2="${svgW}" y2="${barH+20}" stroke="#e2e8f0" stroke-width="2"/>
                    ${barsSVG}
                </svg>
            </div>`;

            // Gráfico pizza por área (SVG donut)
            const pieSize = 160; const cx = pieSize/2; const cy = pieSize/2; const r = 55; const ri = 30;
            let startAngle = -Math.PI/2;
            const areaTotal = areaData.reduce((s,a)=>s+a.total,0)||1;
            const slices = areaData.map(a => {
                const angle = (a.total/areaTotal)*2*Math.PI;
                const x1=cx+r*Math.cos(startAngle), y1=cy+r*Math.sin(startAngle);
                const x2=cx+r*Math.cos(startAngle+angle), y2=cy+r*Math.sin(startAngle+angle);
                const xi1=cx+ri*Math.cos(startAngle), yi1=cy+ri*Math.sin(startAngle);
                const xi2=cx+ri*Math.cos(startAngle+angle), yi2=cy+ri*Math.sin(startAngle+angle);
                const large = angle > Math.PI ? 1 : 0;
                const path = `M${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${large},0 ${xi1},${yi1} Z`;
                startAngle += angle;
                return `<path d="${path}" fill="${a.color}" opacity="0.9" stroke="white" stroke-width="2"/>`;
            }).join('');

            const legend = areaData.map(a => `
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full shrink-0" style="background:${a.color}"></div>
                    <span class="text-[10px] font-black text-slate-600">${a.name} (${a.total})</span>
                </div>`).join('');

            const pieChart = `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <p class="text-sm font-black text-slate-700 mb-4">VOLUME POR ÁREA</p>
                <div class="flex gap-6 items-center">
                    <svg viewBox="0 0 ${pieSize} ${pieSize}" width="160" height="160" style="shrink:0">${slices}</svg>
                    <div class="grid grid-cols-1 gap-1 flex-1">${legend}</div>
                </div>
            </div>`;

            // Barras horizontais por área (conclusão)
            const areaBarras = areaData.map(a => {
                const pct = a.total > 0 ? Math.round((a.conc/a.total)*100) : 0;
                return `<div class="mb-3">
                    <div class="flex justify-between text-xs font-black text-slate-600 mb-1">
                        <span>${a.name}</span><span>${a.conc}/${a.total} (${pct}%)</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                        <div class="h-4 rounded-full transition-all" style="width:${pct}%;background:${a.color}"></div>
                    </div>
                </div>`;
            }).join('');

            const areaChart = `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <p class="text-sm font-black text-slate-700 mb-4">CONCLUSÃO POR ÁREA</p>
                ${areaBarras || '<p class="text-slate-400 text-xs">Sem dados</p>'}
            </div>`;

            // Documento financeiro
            const docChart = `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <p class="text-sm font-black text-slate-700 mb-4">STATUS FINANCEIRO</p>
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-xs font-black mb-1"><span class="text-blue-600">COM REQUISIÇÃO</span><span>${d.filter(p=>p.status_requisicao==='REQUISIÇÃO').length}</span></div>
                        <div class="w-full bg-slate-100 rounded-full h-4"><div class="h-4 rounded-full bg-blue-600" style="width:${total>0?Math.round(d.filter(p=>p.status_requisicao==='REQUISIÇÃO').length/total*100):0}%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-black mb-1"><span class="text-green-600">PEDIDO DE COMPRA</span><span>${d.filter(p=>p.status_requisicao==='PEDIDO DE COMPRA').length}</span></div>
                        <div class="w-full bg-slate-100 rounded-full h-4"><div class="h-4 rounded-full bg-green-600" style="width:${total>0?Math.round(d.filter(p=>p.status_requisicao==='PEDIDO DE COMPRA').length/total*100):0}%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-xs font-black mb-1"><span class="text-slate-400">SEM DOCUMENTO</span><span>${d.filter(p=>!p.status_requisicao).length}</span></div>
                        <div class="w-full bg-slate-100 rounded-full h-4"><div class="h-4 rounded-full bg-slate-400" style="width:${total>0?Math.round(d.filter(p=>!p.status_requisicao).length/total*100):0}%"></div></div>
                    </div>
                </div>
            </div>`;

            dash.innerHTML = progressBar + kpiCards + `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${barChart}${pieChart}</div>` + `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${areaChart}${docChart}</div>`;
        }

        function abrirEdicao(id) { 
            const p = dadosGerais.find(x => x.id === id); 
            document.getElementById('edit-id').value = id; 
            document.getElementById('edit-titulo').value = p.titulo; 
            document.getElementById('edit-responsavel').value = p.responsavel; 
            document.getElementById('edit-area').value = p.area || 'OUTROS';
            document.getElementById('edit-requisicao').value = p.status_requisicao || '';
            document.getElementById('edit-data-inicio').value = p.data_inicio; 
            document.getElementById('edit-data-fim').value = p.data_conclusao; 
            document.getElementById('modal-edit').classList.remove('hidden'); 
        }

        // CRUD Eventos
        document.getElementById('form-plano').addEventListener('submit', async(e)=>{ 
            e.preventDefault(); 
            await db.collection("planos").add({ 
                titulo: document.getElementById('titulo').value.toUpperCase(), 
                responsavel: document.getElementById('responsavel').value, 
                area: document.getElementById('area').value,
                status_requisicao: document.getElementById('status_requisicao').value,
                data_inicio: document.getElementById('data_inicio').value, 
                data_conclusao: document.getElementById('data_conclusao').value, 
                status: "Não iniciado", observacao: "", timestamp: Date.now() 
            }); 
            e.target.reset(); toggleForm(); 
        });

        document.getElementById('form-edit').addEventListener('submit', async(e)=>{ 
            e.preventDefault(); 
            await db.collection("planos").doc(document.getElementById('edit-id').value).update({ 
                titulo: document.getElementById('edit-titulo').value.toUpperCase(), 
                responsavel: document.getElementById('edit-responsavel').value, 
                area: document.getElementById('edit-area').value,
                status_requisicao: document.getElementById('edit-requisicao').value,
                data_inicio: document.getElementById('edit-data-inicio').value, 
                data_conclusao: document.getElementById('edit-data-fim').value 
            }); 
            fecharModal(); 
        });

    function exportarDados() {
        if (!dadosGerais || dadosGerais.length === 0) { alert('Nenhum dado carregado ainda! Aguarde os dados aparecerem na tela.'); return; }
        const blob = new Blob([JSON.stringify(dadosGerais, null, 2)], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'backup_executepro_' + new Date().toISOString().slice(0,10) + '.json';
        a.click();
        alert('✅ ' + dadosGerais.length + ' registros exportados com sucesso!');
    }
    </script>
</body>
